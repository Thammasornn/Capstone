# namespace prod · เว็บอยู่ที่ http://cp26ms3.sit.kmutt.ac.th/prod/ · ห้ามใส่ข้อมูล mock (02_seed_mock.sql)
#   kubectl apply -k devops/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: bangmod-frontend
    newTag: prod
patches:
  - target: { kind: Ingress, name: web }
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        value: /prod
configMapGenerator:
  - name: app-config
    literals:
      # ห้ามใช้โปรไฟล์ local (key ทดสอบที่อยู่ใน git) บน server
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/bangmod_attendance
      - DB_USER=postgres
      - AI_SERVICE_URL=http://ai-service:8080
      # FE เรียกผ่าน NGINX (same origin) จึงไม่ต้องใช้ CORS · ใส่ไว้เผื่อเปิด FE จากโดเมนอื่น
      - CORS_ORIGINS=http://localhost:5173
      # B2: URL ภาพสด (WHEP) = <VITE_BASE>media → NGINX ของ frontend ส่งต่อไป MediaMTX (namespace media)
      # ไม่ใส่โดเมน = เบราว์เซอร์เรียกใน origin เดียวกับหน้าเว็บ (HTTPS ไม่โดน mixed content) · เปลี่ยน VITE_BASE ต้องเปลี่ยนตาม (/prod/)
      - MEDIA_BASE_URL=/prod/media
# ความลับ: copy secret.env.example → secret.env (ไม่ถูก commit) แล้วใส่ค่าจริง
secretGenerator:
  - name: app-secret
    envs:
      - secret.env
