# namespace prod · เว็บอยู่ที่ https://bscit.sit.kmutt.ac.th/capstone26/cp26ms3/prod/ (bscit ตัด /capstone26/cp26ms3 แล้วส่งมาที่ /prod/ ของ VM)
# ห้ามใส่ข้อมูล mock (02_seed_mock.sql / 03 / 04) · ห้าม TEST_ACCOUNTS_ENABLED
#   kubectl apply -k devops/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: bangmod-frontend
    newTag: prod
patches:
  - target: { kind: Ingress, name: web }
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        # ต้องตรงกับ APP_PATH ใน frontend/.env.production (deploy.sh ตรวจก่อน apply)
        value: /prod
configMapGenerator:
  - name: app-config
    literals:
      # ห้ามใช้โปรไฟล์ local (key ทดสอบที่อยู่ใน git) บน server
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/bangmod_attendance
      - DB_USER=postgres
      - AI_SERVICE_URL=http://ai-service:8080
      # เบราว์เซอร์เปิดผ่าน https://bscit.sit.kmutt.ac.th (bscit ส่งต่อมาเป็น HTTP host อื่น) → Spring มองว่าข้ามโดเมน
      # ไม่ใส่ = POST ทุกตัว (login, อัปโหลดใบหน้า) ได้ 403 "Invalid CORS request" ทั้งที่หน้าเว็บโหลดได้ · prod ไม่ใส่ localhost
      - CORS_ORIGINS=https://bscit.sit.kmutt.ac.th
      # B2: URL ภาพสด (WHEP) = <VITE_BASE>media → NGINX ของ frontend ส่งต่อไป MediaMTX (namespace media)
      # ไม่ใส่โดเมน = เบราว์เซอร์เรียกใน origin เดียวกับหน้าเว็บ (HTTPS ไม่โดน mixed content) · เปลี่ยน VITE_BASE ต้องเปลี่ยนตาม (/capstone26/cp26ms3/prod/)
      - MEDIA_BASE_URL=/capstone26/cp26ms3/prod/media
# ความลับ: copy secret.env.example → secret.env (ไม่ถูก commit) แล้วใส่ค่าจริง
secretGenerator:
  - name: app-secret
    envs:
      - secret.env
