# namespace uat · เว็บอยู่ที่ https://bscit.sit.kmutt.ac.th/capstone26/cp26ms3/uat/ (bscit ตัด /capstone26/cp26ms3 แล้วส่งมาที่ /uat/ ของ VM) · ใส่ข้อมูล mock ได้ (init-db.sh uat --seed)
#   kubectl apply -k devops/k8s/overlays/uat
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: uat
resources:
  - namespace.yaml
  - ../../base
images:
  - name: bangmod-frontend
    newTag: uat
patches:
  - target: { kind: Ingress, name: web }
    patch: |-
      - op: replace
        path: /spec/rules/0/http/paths/0/path
        # ต้องตรงกับ APP_PATH ใน frontend/.env.uat (deploy.sh ตรวจก่อน apply)
        value: /uat
configMapGenerator:
  - name: app-config
    literals:
      # ห้ามใช้โปรไฟล์ local (key ทดสอบที่อยู่ใน git) บน server
      - SPRING_PROFILES_ACTIVE=prod
      - DB_URL=jdbc:postgresql://postgres:5432/bangmod_attendance
      - DB_USER=postgres
      - AI_SERVICE_URL=http://ai-service:8080
      # หน้า Login แสดงบัญชีใน DB (GET /api/test-accounts ไม่ต้อง login) — uat เท่านั้น ห้ามใส่ใน prod
      - TEST_ACCOUNTS_ENABLED=true
      # เบราว์เซอร์เปิดผ่าน https://bscit.sit.kmutt.ac.th (bscit ส่งต่อมาเป็น HTTP host อื่น) → Spring มองว่าข้ามโดเมน
      # ไม่ใส่ = POST ทุกตัว (login, อัปโหลดใบหน้า) ได้ 403 "Invalid CORS request" ทั้งที่หน้าเว็บโหลดได้
      - CORS_ORIGINS=https://bscit.sit.kmutt.ac.th,http://localhost:5173
      # B2: URL ภาพสด (WHEP) = <VITE_BASE>media → NGINX ของ frontend ส่งต่อไป MediaMTX (namespace media)
      # ไม่ใส่โดเมน = เบราว์เซอร์เรียกใน origin เดียวกับหน้าเว็บ (HTTPS ไม่โดน mixed content) · เปลี่ยน VITE_BASE ต้องเปลี่ยนตาม (/capstone26/cp26ms3/uat/)
      - MEDIA_BASE_URL=/capstone26/cp26ms3/uat/media
# ความลับ: copy secret.env.example → secret.env (ไม่ถูก commit) แล้วใส่ค่าจริง
secretGenerator:
  - name: app-secret
    envs:
      - secret.env
