# AI Service · โมเดลอยู่บน VM ที่ /opt/bangmod/models (ดู devops/README.md) ไม่มีโมเดล = pod start ไม่ขึ้น
apiVersion: v1
kind: Service
metadata:
  name: ai-service
spec:
  selector:
    app: ai-service
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: bangmod-ai-service:latest
          imagePullPolicy: Never   # image มาจาก build-images.sh (ไม่มี registry) · ลืม import = ErrImageNeverPull
          env:
            - name: YOLO_FACE_MODEL
              value: /models/yolov8n-face-pose.pt
            - name: SFACE_MODEL
              value: /models/face_recognition_sface_2021dec.onnx
            # anti-spoofing ตอนลงทะเบียน (MiniFASNet) · ไม่มีไฟล์ = ปิดเอง (pod ยังขึ้น)
            # on = ปฏิเสธภาพที่คะแนน < ANTISPOOF_MIN_REAL · log = คืนคะแนนแต่ไม่ปฏิเสธ · off = ไม่ใช้
            - name: ANTISPOOF
              value: "on"
            - name: ANTISPOOF_MIN_REAL
              value: "0.7"
            - name: ANTISPOOF_MODEL_V2
              value: /models/minifasnet_v2.onnx
            - name: ANTISPOOF_MODEL_V1SE
              value: /models/minifasnet_v1se.onnx
            - name: INTERNAL_API_KEY
              valueFrom: { secretKeyRef: { name: app-secret, key: INTERNAL_API_KEY } }
            # ---- ตัวอ่านกล้อง (camera_worker.py): MediaMTX → จับคู่ใบหน้า → backend /api/internal/** ----
            - name: CAMERA_WORKER
              value: "true"
            # ถอดรหัส embedding ที่ backend ส่งมา (ค่าเดียวกับ backend · ห้ามเปลี่ยนหลังมีข้อมูลใบหน้า)
            - name: FACE_EMBEDDING_KEY
              valueFrom: { secretKeyRef: { name: app-secret, key: FACE_EMBEDDING_KEY } }
            - name: BACKEND_URL
              value: http://backend:8081
            # MediaMTX ตัวเดียวใช้ร่วม uat / prod (devops/k8s/mediamtx) · path = cameras.stream_path
            - name: MEDIAMTX_RTSP_URL
              value: rtsp://mediamtx.media.svc.cluster.local:8554
            - name: OPENCV_FFMPEG_CAPTURE_OPTIONS
              value: rtsp_transport;tcp
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { memory: 3Gi }
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        - name: models
          hostPath:
            path: /opt/bangmod/models
            type: Directory
