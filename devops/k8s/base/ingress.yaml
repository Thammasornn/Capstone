# Traefik (Ingress ของ K3s) ส่ง /<env>/* ทั้งหมดไป frontend โดยไม่ตัด prefix
# /api ผ่าน NGINX ของ frontend ต่อไป backend (ตัวเลือก "proxy /api") · overlay uat เปลี่ยน path เป็น /capstone26/uat
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
spec:
  rules:
    - http:
        paths:
          - path: /prod
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
