# Vue + NGINX · NGINX ส่ง <base>api/* ต่อไป BACKEND_URL (ดู frontend/nginx.conf)
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # tag prod / uat = build คนละ base path (VITE_BASE) · overlay เลือก tag ให้
          image: bangmod-frontend:prod
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend:8081
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
