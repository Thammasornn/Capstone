server:
  port: ${SERVER_PORT:8081}   # เปลี่ยนได้ด้วย env หรือ backend/.env.local
  # อยู่หลัง NGINX ของ FE / Ingress: ใช้ X-Forwarded-For เป็น IP จริง (audit_logs, consent_records)
  # native = เชื่อ header จาก proxy ใน network ภายในเท่านั้น (10.x, 172.16–31.x, 192.168.x, 127.x)
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  profiles:
    # ไม่ได้ตั้ง SPRING_PROFILES_ACTIVE = เครื่องนักพัฒนา → โหลด application-local.yml (key ทดสอบ)
    # Docker image / K3s ตั้ง SPRING_PROFILES_ACTIVE=prod → ต้องตั้ง JWT_SECRET, FACE_EMBEDDING_KEY เอง
    default: local
  config:
    # ค่าส่วนตัวของแต่ละเครื่อง (ไม่ถูก commit) · รันจาก backend/ หรือจาก root ของ repo ก็เจอ
    import:
      - optional:file:.env.local[.properties]
      - optional:file:backend/.env.local[.properties]
  web:
    error:
      # ให้ FE เห็นข้อความ error ที่เราเขียนไว้ (เช่น "ไม่พบรายวิชา")
      # Spring Boot 4 ย้ายมาจาก server.error.include-message (ชื่อเดิมไม่มีผลแล้ว)
      include-message: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bangmod_attendance}   # สร้างด้วย backend/db/00_create_database.sql
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    # schema มาจาก backend/db/*.sql (รันด้วย psql ตาม backend/db/README.md และ CI database.yml)
    # ถ้าจะให้ Flyway ดูแล: copy 01_schema.sql เป็น db/migration/V1__init_schema.sql แล้วตั้ง FLYWAY_ENABLED=true
    enabled: ${FLYWAY_ENABLED:false}
  servlet:
    multipart:
      max-file-size: 5MB      # Face Register: ภาพละไม่เกิน 5MB
      max-request-size: 25MB  # สูงสุด 5 ภาพ

# Face Register -> AI Service
ai-service:
  base-url: ${AI_SERVICE_URL:http://ai-service:8080}
  connect-timeout-ms: 3000
  read-timeout-ms: 30000

# Login (JWT)
app:
  jwt:
    secret: ${JWT_SECRET:}          # บังคับตั้ง ยาว >= 32 ตัวอักษร (openssl rand -base64 48) · โปรไฟล์ local มีค่าทดสอบให้
    expires-minutes: 480
  face:
    embedding-key: ${FACE_EMBEDDING_KEY:}   # บังคับตั้ง: base64 ของ 32 ไบต์ (openssl rand -base64 32) ใช้เข้ารหัส face_embeddings · โปรไฟล์ local มีค่าทดสอบให้
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}   # คั่นด้วย , ได้หลายโดเมน
  internal:
    # กุญแจร่วมระหว่าง backend <-> AI Service (header X-Internal-Key) ต้องตั้งค่าเดียวกันทั้งสองฝั่ง
    # ว่าง = ปิด /api/internal/** ทั้งหมด และแจ้ง AI Service ไม่ได้
    api-key: ${INTERNAL_API_KEY:}
  media:
    # B2: URL ที่เบราว์เซอร์ใช้เปิดภาพจาก MediaMTX (WHEP) = <base-url>/<cameras.stream_path>/whep
    base-url: ${MEDIA_BASE_URL:http://localhost:8889}
    stream-ttl-minutes: 90
