# NGINX ใน container ของ Front-End
# Ingress (K3s) ส่ง /prod/* หรือ /uat/* มาที่ pod นี้ โดยไม่ตัด prefix
# ไฟล์ build อยู่ที่ราก /usr/share/nginx/html จึง alias prefix → โฟลเดอร์ build
# ${APP_BASE} มาจาก env ใน Dockerfile (production /prod/ · uat /uat/)
server {
  listen 80;
  server_name _;

  # ไฟล์ที่มี hash ในชื่อ cache ได้นาน
  location ${APP_BASE}assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Vue Router (history mode): ทุก path ที่ไม่ใช่ไฟล์ → index.html
  location ${APP_BASE} {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ ${APP_BASE}index.html;
    add_header Cache-Control "no-cache";
  }

  # /api ไม่ผ่าน container นี้ — Ingress route /prod/api, /uat/api ไป Spring Boot โดยตรง
}
