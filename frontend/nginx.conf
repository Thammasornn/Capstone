# NGINX ใน container ของ Front-End
# Ingress (K3s) ส่ง /prod/* หรือ /uat/* ทั้งหมดมาที่ pod นี้ โดยไม่ตัด prefix
# ${APP_BASE} = APP_PATH (หรือ VITE_BASE) ใน .env.<MODE> — Dockerfile ใส่ค่าตอน build
#  - ${APP_BASE}api/*   → ส่งต่อไป Spring Boot ที่ ${BACKEND_URL}/api/* (ตัด prefix ออก)
#  - ${APP_BASE}media/* → ส่งต่อไป MediaMTX ที่ ${MEDIAMTX_URL}/* (WHEP ภาพสด)
#  - ที่เหลือ            → ไฟล์ build ของ Vue (alias prefix → /usr/share/nginx/html)
# ${APP_BASE} ใส่ตอน build (Dockerfile) · ${BACKEND_URL} / ${MEDIAMTX_URL} / ${NGINX_LOCAL_RESOLVERS} แทนค่าตอน start (env ของ container)
server {
  listen 80;
  server_name _;

  # ลงทะเบียนใบหน้า: สูงสุด 5 ภาพ ภาพละ 5MB (ตรงกับ spring.servlet.multipart.max-request-size)
  client_max_body_size 25m;

  # ---------- API → Spring Boot ----------
  location ${APP_BASE}api/ {
    proxy_pass ${BACKEND_URL}/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # ลงทะเบียนใบหน้ารอ AI Service (FE timeout 60 วินาที)
    proxy_read_timeout 90s;
  }

  # B3 SSE: ห้าม buffer และต้องเปิดค้างได้นาน (backend timeout 30 นาที, ส่ง ping ทุก 25 วินาที)
  location ~ ^${APP_BASE}api/rooms/[^/]+/events$ {
    rewrite ^${APP_BASE}api/(.*)$ /api/$1 break;
    proxy_pass ${BACKEND_URL};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection '';
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # token อยู่ใน query (?access_token=) — ไม่เขียนลง access log
    access_log off;
  }

  # /api/internal/** ใช้ภายใน cluster เท่านั้น (AI Service → backend) ห้ามเปิดผ่านหน้าเว็บ
  location ${APP_BASE}api/internal/ {
    return 404;
  }

  # ---------- ภาพสด (WHEP) → MediaMTX ----------
  # B2 ส่ง URL <MEDIA_BASE_URL>/<stream_path>/whep · MEDIA_BASE_URL = <VITE_BASE>media (ไม่ใส่โดเมน)
  # → เบราว์เซอร์ POST ใน origin เดียวกับหน้าเว็บ (HTTPS ของ bscit) ไม่โดนบล็อกเป็น mixed content
  # ${MEDIAMTX_URL} หาชื่อตอนมี request (resolver + ตัวแปร) ไม่ใช่ตอน start
  #   → ไม่มี MediaMTX (เช่น namespace media ยังไม่ apply) = ได้ 502 เฉพาะ path นี้ หน้าเว็บยังขึ้นปกติ
  # ตัวภาพ (WebRTC UDP 8189) ยังวิ่งตรงไป IP ของ VM ไม่ผ่านที่นี่
  location ${APP_BASE}media/ {
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $mediamtx ${MEDIAMTX_URL};
    rewrite ^${APP_BASE}media/(.*)$ /$1 break;
    proxy_pass $mediamtx;
    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # ---------- Vue ----------
  # ไฟล์ที่มี hash ในชื่อ cache ได้นาน
  location ${APP_BASE}assets/ {
    alias /usr/share/nginx/html/assets/;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Vue Router (history mode): ทุก path ที่ไม่ใช่ไฟล์ → index.html
  location ${APP_BASE} {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ ${APP_BASE}index.html;
    add_header Cache-Control "no-cache";
  }
}
